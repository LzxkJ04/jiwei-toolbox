[package]
name = "jiwei-toolbox"
version = "1.0.0"
description = "极维工具箱 - Windows 系统工具集"
edition = "2021"

# 产物二进制名：target/release/jiwei-toolbox.exe
[[bin]]
name = "jiwei-toolbox"
path = "src/main.rs"

[lib]
name = "jiwei_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
# 禁用默认 features（排除 dx12）：wgpu-hal 24.0.4 的 gpu-allocator 0.27 与 windows 0.58 存在版本冲突；
# Vulkan/GLES 后端在 Windows 上无需 feature 即内置
wgpu = { version = "24", default-features = false, features = ["wgsl"] }
reqwest = { version = "0.12", features = ["blocking"] }
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
winreg = "0.52"
rfd = "0.15"
encoding_rs = "0.8"
chrono = "0.4"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
